<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevChat — Real-Time Collaboration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Space Mono', monospace; background: #0a0c10; color: #e2e8f0; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e2130; border-radius: 4px; }

      @keyframes typingBounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40%           { transform: translateY(-6px); opacity: 1; }
      }

      /* Auth page styles */
      .auth-page {
        min-height: 100vh;
        background: #0a0c10;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Space Mono', monospace;
        background-image: linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .auth-card {
        width: 420px;
        background: #0d0f14;
        border: 1px solid #1e2130;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      }
      .auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
      .logo-icon { font-size: 28px; width: 42px; height: 42px; background: linear-gradient(135deg, #4f46e5, #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(99,102,241,0.4); }
      .logo-title { font-size: 18px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.5px; }
      .logo-sub { font-size: 10px; color: #475569; margin-top: 1px; }
      .auth-heading { font-size: 22px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.5px; margin-bottom: 6px; }
      .auth-sub { font-size: 12px; color: #475569; margin-bottom: 28px; }
      .auth-form { display: flex; flex-direction: column; gap: 0; }
      .field { margin-bottom: 16px; }
      .field label { display: block; font-size: 10px; color: #6b7280; margin-bottom: 6px; letter-spacing: 1px; }
      .field input {
        width: 100%; padding: 11px 14px;
        background: #1a1d27; border: 1px solid #252836;
        border-radius: 10px; color: #e2e8f0; font-size: 13px;
        font-family: 'Space Mono', monospace; outline: none;
        transition: border-color 0.2s;
      }
      .field input:focus { border-color: #6366f1; }
      .btn-primary {
        width: 100%; padding: 13px;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        border: none; border-radius: 12px; color: #fff;
        font-size: 14px; font-weight: 700; cursor: pointer;
        font-family: 'Space Mono', monospace; letter-spacing: 0.5px;
        transition: opacity 0.2s; margin-bottom: 16px;
      }
      .btn-primary:disabled { opacity: 0.6; cursor: default; }
      .auth-switch { text-align: center; font-size: 12px; color: #475569; }
      .auth-switch a { color: #6366f1; text-decoration: none; font-weight: 600; }

      input, textarea, button { font-family: 'Space Mono', monospace; }
      textarea { resize: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
